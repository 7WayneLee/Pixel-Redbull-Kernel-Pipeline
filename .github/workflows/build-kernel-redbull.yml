name: Pixel 5 clean kernel (baseline / Next)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build baseline first; use next only after baseline boots'
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - next

permissions:
  contents: read

concurrency:
  group: pixel5-clean-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Linux build environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc libssl-dev libelf-dev libncurses5-dev libncurses5 lz4 rsync git curl
          df -h "$GITHUB_WORKSPACE"
      - name: Build pinned Google kernel
        env:
          PIXEL5_MODE: ${{ inputs.mode }}
        run: bash tools/pixel5-clean/build.sh
      - name: Upload kernel and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel5-clean-${{ inputs.mode }}-${{ github.run_id }}
          path: pixel5-artifacts/
          if-no-files-found: error
          retention-days: 14
